<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>NA 自动配置工具 · 产品介绍</title>
<script>
  window.DECK_MANIFEST = [
    { file: "slides/01-cover.html", label: "封面" },
    { file: "slides/02-agenda.html", label: "演示目录" },
    { file: "slides/02-problem.html", label: "背景与痛点" },
    { file: "slides/03-modules.html", label: "四大模块" },
    { file: "slides/04-architecture.html", label: "系统架构" },
    { file: "slides/05-extract.html", label: "智能提取" },
    { file: "slides/13-channel-types.html", label: "渠道类型" },
    { file: "slides/06-llm.html", label: "LLM 增强" },
    { file: "slides/07-batch-channels.html", label: "渠道管理" },
    { file: "slides/08-batch-tokens.html", label: "令牌与分组" },
    { file: "slides/09-data-summary.html", label: "数据汇总" },
    { file: "slides/10-ui-theme.html", label: "界面与主题" },
    { file: "slides/11-workflow.html", label: "推荐工作流" },
    { file: "slides/17-agent.html", label: "全流程智能体" },
    { file: "slides/12-quickstart.html", label: "快速启动" },
    { file: "slides/14-api-cli.html", label: "API 与 CLI" },
    { file: "slides/15-faq.html", label: "配置与 FAQ" },
    { file: "slides/16-closing.html", label: "结语" },
  ];
  window.DECK_WIDTH = 1920;
  window.DECK_HEIGHT = 1080;
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: "PingFang SC", "Source Sans 3", sans-serif; background: #efece4; }
  .overview { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; }
  body[data-mode="present"] .overview { display: none; }
  body[data-mode="present"] .start-btn { display: none; }
  body[data-mode="overview"] #present-ui { display: none; }

  #ov-grid {
    min-height: 100%;
    padding: 72px 48px 100px;
    background: radial-gradient(120% 90% at 50% 0%, #f4f1e9, #e7e3d8 75%);
  }
  .overview-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #5a5346;
    opacity: 0.66;
    margin-bottom: 10px;
  }
  .overview-hint {
    text-align: center;
    font-size: 13px;
    color: #6b7789;
    margin-bottom: 36px;
  }
  .wall {
    display: grid;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    position: relative;
    aspect-ratio: 16/9;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    background: #f4f1ea;
    border: 1px solid rgba(20, 28, 40, 0.12);
    box-shadow: 0 8px 24px rgba(40, 34, 24, 0.12);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px 22px 16px;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(40, 34, 24, 0.18);
    border-color: rgba(14, 116, 144, 0.35);
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 20px; right: 20px;
    height: 3px;
    background: linear-gradient(90deg, #0e7490, #0c4a6e);
    border-radius: 0 0 2px 2px;
  }
  .card-num {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 32px;
    font-weight: 600;
    color: rgba(14, 116, 144, 0.25);
    line-height: 1;
  }
  .card-label {
    font-family: "Noto Serif SC", "Source Serif 4", serif;
    font-size: 18px;
    font-weight: 700;
    color: #141c28;
    line-height: 1.35;
  }
  .card-meta {
    font-size: 12px;
    color: #6b7789;
    letter-spacing: 0.04em;
  }

  .start-btn {
    position: fixed; bottom: 26px; right: 26px; border: 0;
    padding: 13px 24px; border-radius: 999px; font-size: 15px;
    font-family: inherit; cursor: pointer; z-index: 200;
    background: #1a1712; color: #fff;
    box-shadow: 0 8px 28px rgba(40, 34, 24, 0.28);
  }
  .start-btn:hover { transform: translateY(-2px); }

  #stage {
    position: fixed; top: 50%; left: 50%;
    transform-origin: top left; background: #fff;
    box-shadow: 0 10px 60px rgba(0, 0, 0, 0.4);
  }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .counter {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0, 0, 0, 0.65); color: #fff;
    padding: 6px 14px; border-radius: 999px; font-size: 13px; z-index: 100; opacity: 0.85;
  }
  .counter .label { color: rgba(255,255,255,0.7); margin-left: 8px; }
  .overview-btn {
    position: fixed; top: 20px; left: 20px;
    background: rgba(0, 0, 0, 0.55); color: rgba(255,255,255,0.85);
    border: 0; padding: 7px 14px; border-radius: 999px;
    font-size: 13px; font-family: inherit; cursor: pointer; z-index: 100;
  }
  .nav-zone { position: fixed; top: 0; bottom: 0; width: 12%; cursor: pointer; z-index: 50; }
  .nav-zone.left { left: 0; } .nav-zone.right { right: 0; }
</style>
</head>
<body data-mode="overview">
<div id="ov-grid" class="overview">
  <div class="overview-title">NA 自动配置工具 · 18 页产品演示 · 提取/启停/余额/智能体 Jobs+SSE</div>
  <div class="overview-hint">演示模式：← → 翻页 · Esc 返回概览 · 建议按卡片顺序讲解</div>
  <div class="wall" id="wall"></div>
</div>
<button class="start-btn" id="startBtn">▶ 开始演示</button>
<div id="present-ui">
  <div id="stage"><iframe id="frame" src="about:blank"></iframe></div>
  <button class="overview-btn" id="overviewBtn">⊞ 概览</button>
  <div class="nav-zone left" id="navL"></div>
  <div class="nav-zone right" id="navR"></div>
  <div class="counter" id="counter">1 / 1</div>
</div>
<script>
(function () {
  var W = window.DECK_WIDTH || 1920;
  var H = window.DECK_HEIGHT || 1080;
  var deck = window.DECK_MANIFEST || [];
  var PARTS = [
    [5, 'Part 1 · 背景与定位'],
    [11, 'Part 2 · 核心能力'],
    [15, 'Part 3 · 体验与智能体'],
    [18, 'Part 4 · 扩展与收尾']
  ];
  function partLabel(idx) {
    for (var i = 0; i < PARTS.length; i++) {
      if (idx + 1 <= PARTS[i][0]) return PARTS[i][1];
    }
    return '';
  }
  var stage = document.getElementById('stage');
  var frame = document.getElementById('frame');
  var counter = document.getElementById('counter');
  var wall = document.getElementById('wall');
  var storageKey = 'deck-index-' + location.pathname;
  var current = 0;
  var slideUrl = function (file) { return file + (file.indexOf('?') >= 0 ? '&' : '?') + 'motion=full'; };

  stage.style.width = W + 'px';
  stage.style.height = H + 'px';

  function setMode(mode) {
    document.body.setAttribute('data-mode', mode);
    if (mode === 'present') {
      fit();
      show(current);
    } else {
      frame.src = 'about:blank';
    }
  }

  function makeCard(idx) {
    var item = deck[idx];
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-num">' + String(idx + 1).padStart(2, '0') + '</div>' +
      '<div><div class="card-label">' + (item.label || '') + '</div>' +
      '<div class="card-meta">' + partLabel(idx) + ' · 第 ' + (idx + 1) + ' / 18</div></div>';
    card.addEventListener('click', function () {
      current = idx;
      setMode('present');
    });
    return card;
  }

  function buildGrid() {
    wall.innerHTML = '';
    for (var i = 0; i < deck.length; i++) wall.appendChild(makeCard(i));
  }

  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform =
      'translate(' + ((innerWidth - W * s) / 2) + 'px, ' +
      ((innerHeight - H * s) / 2) + 'px) scale(' + s + ')';
    stage.style.top = '0';
    stage.style.left = '0';
  }

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    var url = slideUrl(deck[idx].file);
    if (frame.getAttribute('src') !== url) frame.src = url;
    counter.innerHTML = (idx + 1) + ' / ' + deck.length +
      ' <span class="label">' + (deck[idx].label || '') + '</span>';
    try { localStorage.setItem(storageKey, String(idx)); } catch (e) {}
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.getAttribute('data-mode') === 'present') {
      e.preventDefault();
      setMode('overview');
      return;
    }
    if (document.body.getAttribute('data-mode') !== 'present') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  document.getElementById('startBtn').addEventListener('click', function () { setMode('present'); });
  document.getElementById('overviewBtn').addEventListener('click', function () { setMode('overview'); });

  var resizeTimer;
  window.addEventListener('resize', function () {
    fit();
    clearTimeout(resizeTimer);
  });

  try {
    var v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (e) {}

  buildGrid();
  fit();
})();
</script>
</body>
</html>
