<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="g-teal-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0e7490" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-teal-v" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-glow-tr" cx="100%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f4f1ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-glow-bl" cx="0%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f4f1ea" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 角部光晕 -->
  <rect width="1920" height="1080" fill="url(#g-glow-tr)"/>
  <rect width="1920" height="1080" fill="url(#g-glow-bl)"/>

  <!-- 右上：流水线弧曲线 -->
  <g stroke="#0e7490" stroke-linecap="round" fill="none">
    <path d="M1920 0 C1680 120, 1520 80, 1340 220 S980 360, 820 480" stroke-width="1.2" opacity="0.16"/>
    <path d="M1920 40 C1720 180, 1580 140, 1380 300 S1020 420, 860 540" stroke-width="0.9" opacity="0.11"/>
    <path d="M1920 90 C1760 240, 1620 200, 1420 360 S1080 480, 920 600" stroke-width="0.7" opacity="0.08"/>
    <path d="M1580 0 L1580 320" stroke-width="0.6" opacity="0.07"/>
    <path d="M1720 0 L1720 240" stroke-width="0.6" opacity="0.06"/>
  </g>

  <!-- 左下：同心弧 + 射线 -->
  <g stroke="#0c4a6e" stroke-linecap="round" fill="none">
    <path d="M-40 1120 A 280 280 0 0 1 240 800" stroke-width="1.1" opacity="0.14"/>
    <path d="M-80 1120 A 380 380 0 0 1 300 740" stroke-width="0.85" opacity="0.10"/>
    <path d="M-120 1120 A 480 480 0 0 1 360 680" stroke-width="0.65" opacity="0.07"/>
    <path d="M0 1080 L420 660" stroke-width="0.55" opacity="0.08"/>
    <path d="M0 1080 L520 780" stroke-width="0.55" opacity="0.06"/>
    <path d="M120 1080 L480 720" stroke-width="0.55" opacity="0.05"/>
  </g>

  <!-- 右侧：竖向韵律线 -->
  <g stroke="url(#g-teal-v)" stroke-width="0.75">
    <line x1="1848" y1="120" x2="1848" y2="960"/>
    <line x1="1816" y1="180" x2="1816" y2="900"/>
    <line x1="1784" y1="240" x2="1784" y2="840"/>
  </g>

  <!-- 顶部：水平引导线 -->
  <g stroke="url(#g-teal-h)" stroke-width="0.8">
    <line x1="96" y1="88" x2="720" y2="88"/>
    <line x1="1200" y1="72" x2="1680" y2="72"/>
  </g>

  <!-- 中部：轻量网格（仅右下象限） -->
  <g stroke="#141c28" stroke-width="0.45" opacity="0.045">
    <line x1="1280" y1="640" x2="1880" y2="640"/>
    <line x1="1280" y1="720" x2="1880" y2="720"/>
    <line x1="1280" y1="800" x2="1880" y2="800"/>
    <line x1="1280" y1="880" x2="1880" y2="880"/>
    <line x1="1360" y1="600" x2="1360" y2="960"/>
    <line x1="1520" y1="600" x2="1520" y2="960"/>
    <line x1="1680" y1="600" x2="1680" y2="960"/>
    <line x1="1840" y1="600" x2="1840" y2="960"/>
  </g>

  <!-- 左上：点缀圆环 -->
  <g stroke="#0e7490" fill="none" opacity="0.09">
    <circle cx="140" cy="200" r="48" stroke-width="0.8"/>
    <circle cx="140" cy="200" r="72" stroke-width="0.6"/>
    <circle cx="220" cy="280" r="18" stroke-width="0.7"/>
  </g>

  <!-- 底部：细点阵 -->
  <g fill="#0e7490" opacity="0.07">
    <circle cx="960" cy="1020" r="1.2"/>
    <circle cx="990" cy="1020" r="1.2"/>
    <circle cx="1020" cy="1020" r="1.2"/>
    <circle cx="1050" cy="1020" r="1.2"/>
    <circle cx="1080" cy="1020" r="1.2"/>
    <circle cx="975" cy="1040" r="1"/>
    <circle cx="1005" cy="1040" r="1"/>
    <circle cx="1035" cy="1040" r="1"/>
    <circle cx="1065" cy="1040" r="1"/>
  </g>
</svg>
