<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>18 · 结语</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+SC:wght@400;700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="../shared/perf.css">
<style>
.closing .content {
  display: flex;
  flex-direction: column;
  padding-top: 0;
  padding-bottom: 24px;
}

/* ── 中央 Hero：Thank You 偏上，主标题几何居中 ── */
.closing-stage {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.hero-top {
  position: absolute;
  top: 10%;
  left: 0;
  right: 0;
  text-align: center;
}

.hero-top .eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 18px;
}

.hero-top .hero-ornament {
  width: 48px;
  height: 2px;
  margin: 0 auto;
  background: var(--accent);
  border-radius: 1px;
}

.hero-main {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  max-width: 1280px;
  padding: 0 32px;
  text-align: center;
}

.hero-aura {
  position: absolute;
  left: 50%;
  top: 42%;
  width: 620px;
  height: 280px;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(ellipse at 50% 45%, rgba(34, 211, 238, 0.22), transparent 62%),
    radial-gradient(ellipse at 30% 60%, rgba(14, 116, 144, 0.14), transparent 55%);
  filter: blur(8px);
  pointer-events: none;
  z-index: 0;
}

.closing-hero > *:not(.hero-aura) {
  position: relative;
  z-index: 1;
}

.closing-hero h1 {
  font-size: 76px;
  line-height: 1.16;
  letter-spacing: -0.03em;
  margin: 0 auto;
  text-align: center;
  max-width: 100%;
}

.closing-hero h1 .lead {
  display: block;
  color: var(--ink);
  font-weight: 700;
}

.closing-hero h1 .promise {
  display: inline-flex;
  align-items: baseline;
  gap: 0.18em;
  margin-top: 6px;
  font-weight: 900;
}

.closing-hero h1 .hl {
  position: relative;
  color: var(--accent-deep);
  background: linear-gradient(120deg, #0c4a6e 0%, #0e7490 45%, #0891b2 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.closing-hero h1 .hl::after {
  content: "";
  position: absolute;
  left: 0.06em;
  right: 0.06em;
  bottom: 0.08em;
  height: 0.12em;
  background: linear-gradient(90deg, rgba(14, 116, 144, 0.15), rgba(34, 211, 238, 0.55), rgba(14, 116, 144, 0.15));
  border-radius: 999px;
  z-index: -1;
}

.closing-hero h1 .amp {
  font-size: 0.55em;
  font-weight: 600;
  color: var(--ink-muted);
  letter-spacing: 0.08em;
  vertical-align: 0.18em;
}

/* 中间流水线：三步胶囊 + 动效连线 */
.hero-flow {
  margin: 36px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  max-width: 880px;
}

.flow-node {
  position: relative;
  min-width: 148px;
  padding: 16px 22px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(14, 116, 144, 0.22);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.8) inset,
    0 12px 28px rgba(20, 28, 40, 0.06);
  backdrop-filter: blur(8px);
}

.flow-node .num {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--accent);
  margin-bottom: 4px;
}

.flow-node .label {
  display: block;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
}

.flow-node.out {
  background: linear-gradient(145deg, #0c4a6e, #0e7490 55%, #0891b2);
  border-color: transparent;
  box-shadow: 0 14px 32px rgba(14, 116, 144, 0.28);
}

.flow-node.out .num { color: rgba(255, 255, 255, 0.72); }
.flow-node.out .label { color: #fff; }

.flow-edge {
  width: 56px;
  height: 2px;
  margin: 0 4px;
  position: relative;
  background: linear-gradient(90deg, rgba(14, 116, 144, 0.15), rgba(14, 116, 144, 0.55));
  flex-shrink: 0;
}

.flow-edge::after {
  content: "";
  position: absolute;
  right: -1px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 2px solid var(--accent);
  border-top: 2px solid var(--accent);
  transform: translateY(-50%) rotate(45deg);
}

.flow-edge.pulse {
  overflow: hidden;
}

.flow-edge.pulse::before {
  content: "";
  position: absolute;
  inset: -1px auto -1px 0;
  width: 28%;
  background: linear-gradient(90deg, transparent, #22d3ee, transparent);
  animation: edgeSweep 1.8s ease-in-out infinite;
}

.hero-flow .flow-edge.pulse:nth-child(4)::before { animation-delay: 0.4s; }
.hero-flow .flow-edge.pulse:nth-child(6)::before { animation-delay: 0.8s; }

@keyframes edgeSweep {
  0% { left: -30%; opacity: 0; }
  30% { opacity: 1; }
  100% { left: 110%; opacity: 0; }
}

.hero-punch {
  margin: 28px auto 0;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 10px 22px;
  border-radius: 999px;
  background: rgba(20, 28, 40, 0.04);
  border: 1px solid var(--line);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
}

.hero-punch .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(14, 116, 144, 0.15);
}

.hero-punch em {
  font-style: normal;
  color: var(--accent-deep);
  font-weight: 700;
}

.hero-ornament.bottom {
  width: 120px;
  height: 3px;
  margin: 26px auto 0;
  background: linear-gradient(90deg, transparent, #22d3ee 25%, #0e7490 75%, transparent);
  border-radius: 2px;
}

.hero-ornament.reveal-line {
  transform-origin: center center;
}

body:not(.motion-full) .flow-edge.pulse::before {
  animation: none;
  display: none;
}

/* ── 底部：统计 + 链接，极简一行 ── */
.closing-dock {
  position: relative;
  z-index: 1;
  margin-top: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.closing-dock .stat-row {
  margin-top: 0;
  width: 100%;
  max-width: 720px;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.closing-dock .stat-item {
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.42);
}

.closing-links {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: nowrap;
}

.closing-link {
  padding: 10px 26px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border-radius: 999px;
  white-space: nowrap;
  background: var(--accent-deep);
  color: #fff;
}

.closing-link.outline {
  background: transparent;
  color: var(--accent-deep);
  border: 1.5px solid var(--line-strong);
}
</style>
</head>
<body class="closing">
<header class="masthead reveal-fade">
  <div class="masthead-brand"><img src="../shared/logo.svg" alt="" width="26" height="26"> NA Auto Configuration</div>
  <div class="masthead-meta">18 / 18 · 结语</div>
</header>

<main class="content">
  <div class="closing-stage">
    <div class="hero-top">
      <p class="eyebrow reveal-fade d1">Thank You</p>
      <div class="hero-ornament reveal-line d2"></div>
    </div>
    <div class="hero-main closing-hero">
      <div class="hero-aura" aria-hidden="true"></div>
      <h1 class="reveal-up d3">
        <span class="lead">让 New API 运维回到</span>
        <span class="promise"><span class="hl">可控</span><span class="amp">&</span><span class="hl">可审计</span></span>
      </h1>
      <div class="hero-flow reveal-up d4" aria-label="全流程">
        <div class="flow-node">
          <span class="num">01</span>
          <span class="label">智能提取</span>
        </div>
        <div class="flow-edge pulse" aria-hidden="true"></div>
        <div class="flow-node">
          <span class="num">02</span>
          <span class="label">批量配置</span>
        </div>
        <div class="flow-edge pulse" aria-hidden="true"></div>
        <div class="flow-node">
          <span class="num">03</span>
          <span class="label">数据汇总</span>
        </div>
        <div class="flow-edge pulse" aria-hidden="true"></div>
        <div class="flow-node out">
          <span class="num">OUT</span>
          <span class="label">一条流水线</span>
        </div>
      </div>
      <p class="hero-punch reveal-up d5"><span class="dot" aria-hidden="true"></span>零构建部署 · Flask 单服务 · <em>打开即用</em></p>
      <div class="hero-ornament bottom reveal-line d6"></div>

  </div>

  <div class="closing-dock">
    <div class="stat-row reveal-up d7">
      <div class="stat-item"><div class="stat-val">4</div><div class="stat-label">功能 Tab</div></div>
      <div class="stat-item"><div class="stat-val">8765</div><div class="stat-label">默认端口</div></div>
      <div class="stat-item"><div class="stat-val">0</div><div class="stat-label">构建步骤</div></div>
    </div>
    <div class="closing-links reveal-up d8">
      <span class="closing-link">127.0.0.1:8765</span>
      <span class="closing-link outline">README.md</span>
      <span class="closing-link outline">introduction.html</span>
    </div>
  </div>
</main>

<footer class="footer reveal-fade d9"><span>NA 自动配置工具</span><span>18 / 18 · 结语</span></footer>
<script src="../shared/slide-boot.js"></script>
</body>
</html>
