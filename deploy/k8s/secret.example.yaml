# 复制为 secret.yaml，填写真实值后单独通过安全渠道下发；不要提交 secret.yaml。
apiVersion: v1
kind: Secret
metadata:
  name: na-xm-secrets
  namespace: na-xm
type: Opaque
stringData:
  APP_SECRET_KEY: replace-with-a-long-random-application-secret
  BOOTSTRAP_ADMIN_PASSWORD: replace-with-an-initial-admin-password-at-least-12-chars
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  POSTGRES_PASSWORD: replace-with-a-long-random-postgres-password
  DATABASE_URL: postgresql+psycopg://na_app:replace-with-a-long-random-postgres-password@postgres:5432/na_web
  REDIS_URL: redis://redis:6379/0
