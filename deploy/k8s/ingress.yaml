apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: na-xm-web
  namespace: na-xm
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [na.example.com]
      secretName: na-xm-web-tls  # pragma: allowlist secret — Kubernetes TLS 对象引用，不含凭据。
  rules:
    - host: na.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: na-xm-web
                port:
                  name: http
