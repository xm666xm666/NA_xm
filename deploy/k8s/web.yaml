apiVersion: v1
kind: Service
metadata:
  name: na-xm-web
  namespace: na-xm
spec:
  selector:
    app.kubernetes.io/name: na-xm-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: na-xm-web
  namespace: na-xm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: na-xm-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: na-xm-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: migrate
          image: ghcr.io/replace-me/na-xm:container
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: na-xm-config
            - secretRef:
                name: na-xm-secrets
      containers:
        - name: web
          image: ghcr.io/replace-me/na-xm:container
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: na-xm-config
            - secretRef:
                name: na-xm-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
