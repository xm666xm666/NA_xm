apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: na-xm
spec:
  selector:
    app.kubernetes.io/name: na-xm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: na-xm
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: na-xm-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: na-xm-redis
    spec:
      containers:
        - name: redis
          image: redis:8
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
