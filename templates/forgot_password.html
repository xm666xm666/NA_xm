{% extends "auth_base.html" %}
{% block content %}
  <p class="auth-kicker">恢复访问</p><h1>重置密码</h1><p class="auth-desc">输入注册邮箱。无论邮箱是否存在，页面都会返回相同提示。</p>
  {% if notice %}<p class="auth-alert success">{{ notice }}</p>{% endif %}
  <form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>邮箱<input type="email" name="email" autocomplete="email" required autofocus></label><button class="auth-primary" type="submit">发送重置链接</button></form>
  <div class="auth-links"><a href="/login">返回登录</a></div>
{% endblock %}
