{% extends "auth_base.html" %}
{% block content %}
  <p class="auth-kicker">创建账户</p><h1>注册普通用户</h1><p class="auth-desc">新注册账户默认是用户角色；权限由超管统一管理。</p>
  {% if error %}<p class="auth-alert error">{{ error }}</p>{% endif %}{% if success %}<p class="auth-alert success">{{ success }}</p>{% endif %}
  <form method="post" class="auth-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>用户名<input name="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9_-]+" autocomplete="username" required></label>
    <label>邮箱<input type="email" name="email" autocomplete="email" required></label>
    <label>密码 <small>至少 12 位</small><input type="password" name="password" minlength="12" autocomplete="new-password" required></label>
    <label>确认密码<input type="password" name="password_confirm" minlength="12" autocomplete="new-password" required></label>
    <button class="auth-primary" type="submit">注册</button>
  </form>
  <div class="auth-links"><a href="/login">返回登录</a></div>
{% endblock %}
