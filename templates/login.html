{% extends "auth_base.html" %}
{% block content %}
  <header class="auth-heading">
    <p class="auth-kicker">安全访问</p>
    <h1 id="auth-page-title">登录工作台</h1>
    <p class="auth-desc">使用你的平台账户进入已获授权的功能。</p>
  </header>
  {% if error %}<p class="auth-alert error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="auth-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label><span>用户名或邮箱</span><input name="identity" autocomplete="username" spellcheck="false" required autofocus placeholder="输入用户名或邮箱"></label>
    <label><span>密码</span><span class="auth-input-action"><input type="password" name="password" autocomplete="current-password" required placeholder="输入密码"><button class="password-toggle" type="button" data-password-toggle aria-label="显示密码">显示</button></span></label>
    <div class="auth-form-row"><span class="auth-secure-note">受会话与权限策略保护</span><a href="/forgot-password">忘记密码？</a></div>
    <button class="auth-primary" type="submit">安全登录 <span aria-hidden="true">→</span></button>
  </form>
  <div class="auth-divider"><span>还没有账户？</span></div>
  <a class="auth-secondary" href="/register">创建普通用户账户</a>
{% endblock %}
