{% extends "auth_base.html" %}
{% block content %}
  <p class="auth-kicker">安全访问</p><h1>登录控制台</h1><p class="auth-desc">使用网站账户进入已获授权的功能。</p>
  {% if error %}<p class="auth-alert error">{{ error }}</p>{% endif %}
  <form method="post" class="auth-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_url }}">
    <label>用户名或邮箱<input name="identity" autocomplete="username" required autofocus></label>
    <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="auth-primary" type="submit">登录</button>
  </form>
  <div class="auth-links"><a href="/forgot-password">忘记密码</a><a href="/register">注册普通用户</a></div>
{% endblock %}
