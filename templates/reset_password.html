{% extends "auth_base.html" %}
{% block content %}
  <p class="auth-kicker">更新凭据</p><h1>设置新密码</h1>
  {% if error %}<p class="auth-alert error">{{ error }}</p>{% endif %}
  <form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>新密码 <small>至少 12 位</small><input type="password" name="password" minlength="12" autocomplete="new-password" required></label><label>确认新密码<input type="password" name="password_confirm" minlength="12" autocomplete="new-password" required></label><button class="auth-primary" type="submit">更新密码</button></form>
{% endblock %}
